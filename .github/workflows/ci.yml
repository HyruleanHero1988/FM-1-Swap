name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: macos-26
    permissions:
      contents: read # To check out the code.
    strategy:
      # Let every job finish, so one push shows every problem.
      fail-fast: false
      # The groups of scripts/check.sh, split so the long test run isn't waited on by the rest.
      matrix:
        include:
          - name: Lint, device build and docs
            groups: lint device docs
          - name: Build and test
            groups: build test
          - name: Unused code
            groups: build unused
    steps:
      # project.yml uses FM1Kit from ../FM1Kit, so both are checked out side by side.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: FM-SWITCH
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ocean/FM1Kit
          path: FM1Kit
          persist-credentials: false
      - name: Install XcodeGen, SwiftLint and Periphery
        run: brew install xcodegen swiftlint periphery
      - name: Run the checks
        working-directory: FM-SWITCH
        env:
          GROUPS: ${{ matrix.groups }}
        run: scripts/check.sh $GROUPS # Unquoted, to split the groups into arguments.
