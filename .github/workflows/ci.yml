name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Vendor binaries and drop leftover iOS sources
        run: STRIP_IOS=1 bash scripts/vendor-binaries.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Puts cmdline-tools on PATH and accepts SDK licences so Gradle can
      # download platforms;android-35 / build-tools as AGP asks for them.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Protocol tests
        run: ./gradlew :fm1kit:test --stacktrace --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit the Android tree
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No leftover iOS sources to strip."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace iOS sources with the Android port."
          git push
