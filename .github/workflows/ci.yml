name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "release/screenshots/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "app/src/main/assets/patches/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Vendor binaries and drop leftover iOS sources
        run: |
          chmod +x gradlew scripts/vendor-binaries.sh scripts/make-icon.py || true
          STRIP_IOS=1 bash scripts/vendor-binaries.sh

      # Commit the overwrite even if the Gradle build later fails, so GitHub
      # main becomes the Android tree instead of a mixed iOS fork.
      - name: Commit the Android tree
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No leftover iOS sources to strip."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Commit the Android tree."
          git push

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # The baked list lives in app/src/main/assets/catalogue/snapshot.json.
      # Do not git-push it from this job: GITHUB_TOKEN commits do not start a
      # new workflow, which left main looking like CI never ran.
      - name: Bake firmware catalogue if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=app/src/main/assets/catalogue/snapshot.json
          if [ -s "$out" ]; then
            echo "Catalogue snapshot already present ($(wc -c < "$out") bytes)."
            exit 0
          fi
          mkdir -p "$(dirname "$out")"
          BAKE_CATALOGUE=true ./gradlew :app:testDebugUnitTest --tests com.fmswitch.catalogue.BakeCatalogue --stacktrace --no-daemon
          test -s "$out"

      # TRY's emulator: fm1-emu (MIT) at a pinned commit, compiled to libfm1emu.so per ABI.
      - name: Rust toolchain for the native emulator
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: fm1-native-${{ runner.os }}-${{ hashFiles('native/fm1-jni/Cargo.lock', 'native/fm1-jni/src/**', 'native/patches/**', 'scripts/build-fm1-native.sh') }}
          restore-keys: fm1-native-${{ runner.os }}-

      - name: Build the native FM-1 emulator
        run: |
          bash scripts/build-fm1-native.sh
          test -s app/src/main/jniLibs/arm64-v8a/libfm1emu.so
          test -s app/src/main/jniLibs/x86_64/libfm1emu.so

      - name: Native emulator tests
        run: |
          cargo test --release --manifest-path native/fm1-jni/Cargo.toml --target-dir native/target
          # a host build for the app's JNI unit test (Fm1NativeHostTest boots the bundled V15)
          cargo build --release --manifest-path native/fm1-jni/Cargo.toml --target-dir native/target
          # the pinned fm1-emu plus native/patches: the 386DX / CTL / MC-1 / Kawa decoder
          cargo test -p fm1-core --manifest-path native/fm1-emu-src/Cargo.toml --target-dir native/target-core-test

      - name: Protocol tests
        run: ./gradlew :fm1kit:test :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Name the APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk FM-1-Swap-debug.apk

      - name: Publish debug APK on Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug
          name: Android debug APK
          body: |
            Debug build only (package com.fmswitch.debug, debuggable). The install to share is the release APK on the v0.6.2 tag.

            Built from `${{ github.sha }}` on `main` (versionCode ${{ github.run_number }}).
          files: FM-1-Swap-debug.apk
          fail_on_unmatched_files: true
          make_latest: false

      - name: Drop the previous debug filename
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete-asset android-debug FM-SWITCH-debug.apk --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Assemble release APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "0.6.2"
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Check and publish the release APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk FM-1-Swap.apk
          python3 - << 'PY'
          import base64, os, pathlib
          src = pathlib.Path("release/screenshots")
          dst = pathlib.Path(os.environ["RUNNER_TEMP"]) / "screenshots"
          dst.mkdir(parents=True, exist_ok=True)
          root = src / "pieces"
          names = sorted(p.name for p in root.iterdir() if p.is_dir())
          if names != ["before-you-start", "firmware-list", "flashed"]:
              raise SystemExit(f"expected the three screenshots, found {names}")
          for name in names:
              text = "".join(
                  p.read_text()
                  for p in sorted((root / name).glob("*.txt"), key=lambda p: int(p.stem))
              )
              jpg = base64.b64decode(text)
              if not jpg.startswith(b"\xff\xd8"):
                  raise SystemExit(f"{name} is not a jpeg")
              (dst / f"{name}.jpg").write_bytes(jpg)
              print(f"decoded {name}.jpg ({len(jpg)} bytes)")
          PY
          badging=$(${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0/aapt dump badging FM-1-Swap.apk)
          echo "$badging" | grep -q "package: name='com.fmswitch' "
          if echo "$badging" | grep -q "application-debuggable"; then
            echo "Release APK is debuggable." >&2
            exit 1
          fi
          shots=("$RUNNER_TEMP"/screenshots/*.jpg)
          if gh release view v0.6.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v0.6.2 --repo "$GITHUB_REPOSITORY" --title "FM-1 Swap 0.6.2" --notes-file release/NOTES.md --latest
            gh release upload v0.6.2 FM-1-Swap.apk "${shots[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.6.2 FM-1-Swap.apk "${shots[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "FM-1 Swap 0.6.2" \
              --notes-file release/NOTES.md \
              --latest
          fi

# Release screenshots are on main.
