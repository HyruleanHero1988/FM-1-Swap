name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Vendor binaries and drop leftover iOS sources
        run: |
          chmod +x gradlew scripts/vendor-binaries.sh scripts/make-icon.py || true
          STRIP_IOS=1 bash scripts/vendor-binaries.sh

      # Commit the overwrite even if the Gradle build later fails, so GitHub
      # main becomes the Android tree instead of a mixed iOS fork.
      - name: Commit the Android tree
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No leftover iOS sources to strip."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace iOS sources with the Android port."
          git push

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # The baked list lives in app/src/main/assets/catalogue/snapshot.json.
      # Do not git-push it from this job: GITHUB_TOKEN commits do not start a
      # new workflow, which left main looking like CI never ran.
      - name: Bake firmware catalogue if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=app/src/main/assets/catalogue/snapshot.json
          if [ -s "$out" ]; then
            echo "Catalogue snapshot already present ($(wc -c < "$out") bytes)."
            exit 0
          fi
          mkdir -p "$(dirname "$out")"
          BAKE_CATALOGUE=true ./gradlew :app:testDebugUnitTest --tests com.fmswitch.catalogue.BakeCatalogue --stacktrace --no-daemon
          test -s "$out"

      # TRY's emulator: fm1-emu (MIT) at a pinned commit, compiled to libfm1emu.so per ABI.
      - name: Rust toolchain for the native emulator
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: fm1-native-${{ runner.os }}-${{ hashFiles('native/fm1-jni/Cargo.lock', 'native/fm1-jni/src/**', 'scripts/build-fm1-native.sh') }}
          restore-keys: fm1-native-${{ runner.os }}-

      - name: Build the native FM-1 emulator
        run: |
          bash scripts/build-fm1-native.sh
          test -s app/src/main/jniLibs/arm64-v8a/libfm1emu.so
          test -s app/src/main/jniLibs/x86_64/libfm1emu.so

      - name: Native emulator tests
        run: |
          cargo test --release --manifest-path native/fm1-jni/Cargo.toml --target-dir native/target
          # a host build for the app's JNI unit test (Fm1NativeHostTest boots the bundled V15)
          cargo build --release --manifest-path native/fm1-jni/Cargo.toml --target-dir native/target

      - name: Protocol tests
        run: ./gradlew :fm1kit:test :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Name the APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk FM-SWITCH-debug.apk

      - name: Publish debug APK on Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug
          name: Android debug APK
          body: |
            Sideload this debug build on a phone. USB MIDI to an FM-1 does not work on the emulator.

            Built from `${{ github.sha }}` on `main` (versionCode ${{ github.run_number }}).
            After the first uninstall/reinstall onto the committed debug key, later APKs update in place.
          files: FM-SWITCH-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
