name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish the site
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble screenshots
        run: |
          python3 - << 'PY'
          import base64, pathlib, shutil
          root = pathlib.Path("docs/images/pieces")
          out = pathlib.Path("docs/images")
          names = sorted(p.name for p in root.iterdir() if p.is_dir())
          expected = [
              "try-baud-girl",
              "try-clipper",
              "try-official-open",
              "try-sloop",
          ]
          if names != expected:
              raise SystemExit(f"expected {expected}, found {names}")
          for name in names:
              text = "".join(p.read_text() for p in sorted((root / name).glob("*.txt")))
              jpg = base64.b64decode(text)
              if not jpg.startswith(b"\xff\xd8"):
                  raise SystemExit(f"{name} is not a jpeg")
              dest = out / f"{name}.jpg"
              dest.write_bytes(jpg)
              print(f"{dest.name} {len(jpg)}")
          shutil.rmtree(root)
          logo_root = pathlib.Path("docs/images/logo-pieces")
          if logo_root.is_dir():
              text = "".join(p.read_text() for p in sorted(logo_root.glob("*.txt")))
              png = base64.b64decode(text)
              if not png.startswith(b"\x89PNG"):
                  raise SystemExit("logo is not a png")
              (out / "logo.png").write_bytes(png)
              print(f"logo.png {len(png)}")
              shutil.rmtree(logo_root)
          PY

      # GITHUB_TOKEN cannot create the Pages site. Once Pages is set to
      # GitHub Actions in the repository settings, this step succeeds and
      # the artifact is published.
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Pages is not turned on
        if: steps.pages.outcome != 'success'
        run: echo "The guide was built. Publish it from Settings, Pages, with GitHub Actions as the source, then run this workflow again."

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: docs

      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
