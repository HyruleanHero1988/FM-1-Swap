name: place-launcher-icon

on:
  push:
    paths:
      - .github/workflows/place-launcher-icon.yml

permissions:
  contents: write

jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Write the exact launcher icon text
        run: |
          python3 << 'PY'
          import subprocess
          from pathlib import Path
          p = Path("app/launcher-icons-b.zip.b64")
          b = bytearray(p.read_bytes())
          expected = "cef55c6bf7b4ade76ec002085ef8dec96f27504d"
          def blob_sha(data: bytes) -> str:
              tmp = Path("/tmp/launcher-icon-blob")
              tmp.write_bytes(data)
              return subprocess.check_output(["git", "hash-object", str(tmp)], text=True).strip()
          cur = blob_sha(bytes(b))
          print("current", cur, "size", len(b))
          if cur != expected:
              old = b"evr mcM6jl"
              if b.count(old) != 1:
                  raise SystemExit("inserted-space pattern missing")
              b = bytearray(bytes(b).replace(old, b"evrmcM6jl", 1))
              repls = [
                  (b"o45Etem2UTAt", b"o45Ebem2UTAt"),
                  (b"6mRDj85J+tv", b"6mRDm85J+tv"),
                  (b"8216caF\n", b"8216c6F\n"),
              ]
              for src, dst in repls:
                  if b.count(src) != 1:
                      raise SystemExit(f"pattern missing: {src!r}")
                  b = bytearray(bytes(b).replace(src, dst, 1))
              got = blob_sha(bytes(b))
              print("patched", got, "size", len(b))
              if got != expected:
                  raise SystemExit("patched hash mismatch")
              p.write_bytes(b)
          else:
              print("already exact")
          PY

      - name: Commit the exact launcher icon
        run: |
          set -euo pipefail
          git config user.name "HyruleanHero1988"
          git config user.email "HyruleanHero1988@gmail.com"
          git add app/launcher-icons-b.zip.b64
          git rm -f .github/workflows/place-launcher-icon.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 1
          fi
          git commit -m "Use the supplied FM-1 drawing, on black, as the launcher icon."
          for i in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected, rebasing ($i)"
            git fetch origin main
            git rebase origin/main
            sleep 4
          done
          exit 1
