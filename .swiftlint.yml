# SwiftLint checks what swift-format doesn't: correctness, safety and API hygiene.
# swift-format owns layout, so the layout rules it handles differently are off here.

included:
  - App
  - AppTests

disabled_rules:
  - opening_brace          # swift-format puts a multi-line signature's brace on its own line.
  - trailing_comma         # swift-format decides trailing commas.
  - vertical_parameter_alignment_on_call
  - todo                   # Known open questions are marked in comments deliberately.
  - pattern_matching_keywords  # Contradicts swift-format's UseLetInEveryBoundCaseVariable.

# Left off on purpose:
# - discouraged_optional_collection: `nil` means "no message", which differs from an empty one.
# - no_magic_numbers: the protocol code's masks and shifts read best inline; field offsets and
#   protocol constants are named instead.

opt_in_rules:
  - accessibility_label_for_image
  - anonymous_argument_in_multiline_closure
  - array_init
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_assert
  - discouraged_none_name
  - discouraged_object_literal
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_objc_type
  - literal_expression_end_indentation
  - local_doc_comment
  - lower_acl_than_parent
  - missing_docs
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - nimble_operator
  - no_extension_access_modifier
  - nslocalizedstring_key
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_key_path
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_swiftui_state
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_self
  - redundant_type_annotation
  - return_value_from_void_function
  - self_binding
  - shorthand_optional_binding
  - sorted_first_last
  - static_operator
  - strong_iboutlet
  - superfluous_else
  - toggle_bool
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - unused_parameter
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate
  - yoda_condition

analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

line_length:
  warning: 120
  error: 120
  ignores_comments: false
  ignores_urls: true

missing_docs:
  warning: [open, public]

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 500

function_body_length:
  warning: 60
  error: 80

cyclomatic_complexity:
  warning: 12
  error: 15

identifier_name:
  min_length: 2
  excluded: [id, ui, x, y]  # Coordinates read best by their usual names.

nesting:
  ignore_coding_keys: true  # CodingKeys belong inside the Codable type they describe.

large_tuple:
  warning: 3  # Regex captures and colour components come as three-element tuples.
  error: 4

