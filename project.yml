name: FMSwitch
options:
  bundleIdPrefix: com.drewrobinson
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  # The tagged release, taking 0.2.x fixes but not 0.3.0, which may change the API. To work
  # against a local checkout at ../FM1Kit instead, generate from project.local.yml.
  FM1Kit:
    url: https://github.com/ocean/FM1Kit.git
    minorVersion: 0.2.0
settings:
  base:
    # scripts/check.sh sets FMSWITCH_STRICT=YES to fail on warnings in the app's own targets.
    # Setting the warnings options themselves on the command line would reach FM1Kit too, and
    # Xcode builds a fetched package with warnings suppressed, which clashes.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: $(FMSWITCH_STRICT)
    GCC_TREAT_WARNINGS_AS_ERRORS: $(FMSWITCH_STRICT)
targets:
  FMSwitch:
    type: application
    # One target for iPhone, iPad and a native Mac app.
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - Platform/**
      # Code for one platform only, so neither is compiled (or analysed) for the other.
      - path: App/Platform/iOS
        destinationFilters: [iOS]
      - path: App/Platform/macOS
        destinationFilters: [macOS]
    dependencies:
      - package: FM1Kit
        product: FM1Kit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FM-SWITCH
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UIAppFonts:
          - VT323-Regular.ttf
          - Silkscreen-Regular.ttf
          - Silkscreen-Bold.ttf
          - DepartureMono-Regular.otf
        # The Mac's equivalent: every font in the app's Resources folder.
        ATSApplicationFontsPath: .
        LSApplicationCategoryType: public.app-category.music
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewrobinson.fmswitch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # The Mac app is sandboxed: it reaches the network, opens files the person picks, and
        # talks MIDI, which the sandbox allows.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/FMSwitch-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        ENABLE_PREVIEWS: YES
  FMSwitchTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: AppTests
    dependencies:
      - target: FMSwitch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.drewrobinson.fmswitch.tests
        # A Mac app's executable is inside Contents/MacOS, which XcodeGen's default misses.
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/FMSwitch.app/Contents/MacOS/FMSwitch
schemes:
  FMSwitch:
    build:
      targets:
        FMSwitch: all
    test:
      targets:
        - FMSwitchTests
