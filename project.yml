name: FMSwitch
options:
  bundleIdPrefix: com.drewrobinson
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # The tagged release, taking 0.1.x fixes but not 0.2.0, which may change the API. To work
  # against a local checkout at ../FM1Kit instead, generate from project.local.yml.
  FM1Kit:
    url: https://github.com/ocean/FM1Kit.git
    minorVersion: 0.1.0
settings:
  base:
    # scripts/check.sh sets FMSWITCH_STRICT=YES to fail on warnings in the app's own targets.
    # Setting the warnings options themselves on the command line would reach FM1Kit too, and
    # Xcode builds a fetched package with warnings suppressed, which clashes.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: $(FMSWITCH_STRICT)
    GCC_TREAT_WARNINGS_AS_ERRORS: $(FMSWITCH_STRICT)
targets:
  FMSwitch:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: FM1Kit
        product: FM1Kit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FM-SWITCH
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UIAppFonts:
          - VT323-Regular.ttf
          - Silkscreen-Regular.ttf
          - Silkscreen-Bold.ttf
          - DepartureMono-Regular.otf
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drewrobinson.fmswitch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  FMSwitchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: FMSwitch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.drewrobinson.fmswitch.tests
schemes:
  FMSwitch:
    build:
      targets:
        FMSwitch: all
    test:
      targets:
        - FMSwitchTests
